services:
  hncontrol_web:
    container_name: hncontrol_web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080

      ConnectionStrings__Default: "Host=database_primary;Port=5432;Database=hncontrol;Username=hncontrol_user;Password=${HNCONTROL_DB_PASSWORD};Include Error Detail=false"

      PublicLinks__BaseUrl: "https://control.hubnet-solutions.net"
      Storage__BasePath: "App_Data/uploads"
      Database__PgDumpPath: "pg_dump"
      Database__PsqlPath: "psql"
      Office__Command: "/usr/bin/soffice"

      # Llaves de DataProtection persistentes (cifran WhatsApp/SMTP/MercadoPago/CSD...).
      # Deben sobrevivir a reconstrucciones del contenedor o los secretos se vuelven indescifrables.
      DataProtection__KeysPath: "/app/dp-keys"
    volumes:
      - hncontrol_uploads:/app/App_Data/uploads
      - hncontrol_dpkeys:/app/dp-keys

    networks:
      - infra_net

    expose:
      - "8080"

  # WhatsApp usa la Cloud API oficial de Meta (graph.facebook.com).

volumes:
  hncontrol_uploads:
  hncontrol_dpkeys:

networks:
  infra_net:
    external: true
