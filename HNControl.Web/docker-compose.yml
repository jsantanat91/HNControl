services:
  hncontrol_web:
    container_name: hncontrol_web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080

      ConnectionStrings__Default: "Host=database_primary;Port=5432;Database=hncontrol;Username=hncontrol_user;Password=${HNCONTROL_DB_PASSWORD};Include Error Detail=false"

      PublicLinks__BaseUrl: "https://control.hubnet-solutions.net"
      Storage__BasePath: "App_Data/uploads"
      Database__PgDumpPath: "pg_dump"
      Database__PsqlPath: "psql"
      Office__Command: "/usr/bin/soffice"

    volumes:
      - hncontrol_uploads:/app/App_Data/uploads

    networks:
      - infra_net

    expose:
      - "8080"

  openwacontrol:
    container_name: openwacontrol
    build:
      context: ../openwa-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      API_KEY: "${HNCONTROL_OPENWA_API_KEY:-hncontrol_wa_key_2026}"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    volumes:
      - openwacontrol_sessions:/app/.wwebjs_auth
    networks:
      - infra_net
    expose:
      - "3000"
    # Puerto externo independiente para QR/proxy sin interferir con Ministerium (3001).
    ports:
      - "3002:3000"

volumes:
  hncontrol_uploads:
  openwacontrol_sessions:

networks:
  infra_net:
    external: true
